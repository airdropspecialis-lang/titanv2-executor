[package]
name = "titanv2"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async
tokio = { version = "1.29", features = ["full"] }
anyhow = "1.0"
futures = "0.3"

# Logging
log = "0.4"
env_logger = "0.10"

# 🔒 SOLANA – STABLE & COMPATIBLE
solana-sdk = "=1.16.27"
solana-client = "=1.16.27"

# 🔥 GEYSER – KOMPATIBIL
yellowstone-grpc-client = "=7.0.0"
yellowstone-grpc-proto  = "=7.0.0"

# Jito (vetëm HTTP / bundle)
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Performance
arc-swap = "1.6"
lazy_static = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Metrics
prometheus = "0.13"
warp = "0.3"
